{% extends '_base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login Page{% endblock title %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="h4 mb-3 text-center">Log in</h2>
          <form method="post" action="{% url 'account_login' %}">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100 mt-2">Log in</button>
          </form>
          <div class="text-center small mt-3">
            <div>New here? <a href="{% url 'account_signup' %}">Create an account</a></div>
            <div class="mt-1"><a href="{% url 'account_reset_password' %}">Forgot your password?</a></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
{% endblock content %}
